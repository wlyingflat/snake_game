version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: snake-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: snake_game
      MYSQL_USER: snake
      MYSQL_PASSWORD: snakepass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snake-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mainserver:
    build: .
    container_name: snake-mainserver
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Ddb.host=mysql -Ddb.port=3306 -Ddb.name=snake_game -Ddb.user=snake -Ddb.password=snakepass"
    ports:
      - "9000:9000"          # MainServer 端口
      - "${GATEWAY_PORT:-8080}:8080"  # 内部 Gateway 端口（实际上 Gateway 将独立运行）
    command: ["snake.auth.MainServer", "9000", "8080"]

  gateway:
    build: .
    # 不指定 container_name，允许 scale 扩展
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      JAVA_OPTS: >-
        -Ddb.host=mysql -Ddb.port=3306 -Ddb.name=snake_game -Ddb.user=snake -Ddb.password=snakepass
        -Dredis.host=redis -Dredis.port=6379
        -Dgateway.port=${GATEWAY_PORT:-8080}
    ports:
      - "${GATEWAY_PORT:-8080}"   # 动态端口映射，scale 时由 Docker 自动分配
    command: ["snake.gateway.Gateway"]
    deploy:
      replicas: 2   # 启动 2 个实例，可根据需要修改

volumes:
  mysql_data:
  redis_data:
