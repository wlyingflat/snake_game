# 网络基础参数
buffer.size=8192
select.timeout=1000

# 房间配置
max.players.per.room=8
room.idle.timeout=30
room.init.delay.ticks=5
room.queue.capacity=1024

# 游戏参数
map.width=40
map.height=20
tick.interval.ms=200
max.snake.length=63
obstacle.count=15
max.spawn.attempts=100

# 认证服务（HTTP）
auth.service.port=19001
auth.service.url=http://127.0.0.1:19001

# 网关（Gateway）
gateway.host=127.0.0.1
gateway.port=8080
gateway.default.port=8080
heartbeat.interval=30
heartbeat.timeout=60
room.list.query.port=19003
gateway.admin.port=19004

# Disruptor 环形缓冲区大小
ring.buffer.size=1024

# 数据库
db.host=localhost
db.port=3306
db.name=snake_game
db.user=root
db.password=wmh20050108
db.pool.size=10

# 分布式模式开关
distributed.mode=true
# 节点唯一标识（不设置则自动生成）
node.id=gateway1

#RabbitMQ配置
mq.host=localhost
mq.port=5672
mq.username=guest
