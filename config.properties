# 网络参数
buffer.size=8192
recv.timeout=5000
backlog=128
select.timeout=1000
write.queue.capacity=512
max.connections=10000

# 主服务器
max.users=1024
username.len=32
thread.pool.size=4
thread.queue.size=1024

# 房间
max.rooms=8
max.players.per.room=8
base.room.port=20000
room.idle.timeout=30
room.init.delay.ticks=5
room.queue.capacity=1024

# 游戏
map.width=40
map.height=20
tick.interval.ms=200
init.snake.length=1
max.snake.length=63
obstacle.count=15
max.spawn.attempts=100

# 网关
gateway.port=19000
heartbeat.interval=30
heartbeat.timeout=60
gateway.notify.port=19001
room.list.query.port=19003
gateway.admin.port=19004

# 房间服务器注册端口
room.register.port=19002

# 客户端
max.retry.attempts=5
retry.delay.ms=200
