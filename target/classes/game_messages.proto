syntax = "proto3";
package snake.proto;

// 服务器 -> 客户端的业务消息
message ServerMsg {
  oneof payload {
    JoinOk          join_ok         = 1;
    JoinFail        join_fail       = 2;
    ErrorMsg        error           = 3;
    LoginOk         login_ok        = 4;
    RegisterOk      register_ok     = 5;
    RoomList        room_list       = 6;
    LeaderboardData leaderboard     = 7;
    YouDied         you_died        = 8;
    RoomClosed      room_closed     = 9;
    Ping            ping            = 10;
    Pong            pong            = 11;
  }
}

message JoinOk { int32 room_id = 1; }
message JoinFail { string message = 1; }
message ErrorMsg { string message = 1; }
message LoginOk {
  string gateway_host = 1;
  int32  gateway_port = 2;
}
message RegisterOk {}
message RoomList {
  repeated RoomEntry rooms = 1;
  message RoomEntry {
    int32 id = 1;
    string status = 2; // "OPEN" or "FULL"
    int32 players = 3;
    int32 max_players = 4;
  }
}
message LeaderboardData {
  repeated Entry entries = 1;
  message Entry {
    int32 rank = 1;
    string username = 2;
    int32 score = 3;
  }
}
message YouDied {}
message RoomClosed {}
message Ping {}
message Pong {}
